<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Form</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
padding:20px;
}

.form-box{
background:white;
padding:40px;
border-radius:15px;
text-align:center;
max-width:400px;
width:100%;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
animation:fadeIn 1s ease;
}

h1{
margin-bottom:10px;
color:#333;
}

p{
color:#666;
margin-bottom:25px;
font-size:14px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
outline:none;
}

input:focus{
border-color:#667eea;
}

label{
display:block;
text-align:left;
margin-top:10px;
margin-bottom:3px;
font-size:14px;
color:#333;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
background:#667eea;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#5563d6;
transform:scale(1.03);
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Responsive */

@media (max-width:500px){

.form-box{
padding:25px;
}

h1{
font-size:22px;
}

}

</style>

</head>

<body>

<div class="form-box">

<h1>Login Page</h1>

<p>Please fill in the information below</p>

<form>

<label for="username">Username:</label>    
<input id="username" type="text" placeholder="Enter Your Username" required>

<label for="phone">Phone Number:</label>
<input id="phone" type="tel" placeholder="Enter Your Phone Number" required>

<label for="password">Password:</label>
<input id="password" type="password" placeholder="Enter Your Password" required>

<button id="btn" type="submit">Login</button>

</form>

</div>
 <script src="login.js"></script>
</body>
</html>

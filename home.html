<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Submitted</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
padding:20px;
}

.success-box{
background:white;
padding:40px;
border-radius:15px;
text-align:center;
max-width:400px;
width:100%;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
animation:fadeIn 1s ease;
}

.icon{
font-size:60px;
color:#28a745;
margin-bottom:20px;
}

h1{
font-size:26px;
margin-bottom:10px;
color:#333;
}

p{
color:#555;
margin-bottom:25px;
line-height:1.6;
}

button{
padding:12px 25px;
border:none;
background:#667eea;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#5563d6;
transform:scale(1.05);
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Responsive */

@media (max-width:500px){

.success-box{
padding:25px;
}

h1{
font-size:22px;
}

.icon{
font-size:50px;
}

}

</style>
</head>

<body>

<div class="success-box">

<div class="icon">✔</div>

<h1>Form Submitted Successfully</h1>

<p>
Thank you! Your login has been completely successful.
We have received your information and will process it shortly. If you have any questions, feel free to contact us.
</p>

<a href="index.html">
    <button>Back to Home</button>
</a>

</div>
</body>
</html>
